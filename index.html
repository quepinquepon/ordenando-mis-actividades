<script>
  // Estado local y carga inicial
  let tasks = JSON.parse(localStorage.getItem('mis_actividades')) || [];
  let currentFilter = 'todas';
  let currentDate = new Date();

  const form = document.getElementById('task-form');
  const taskList = document.getElementById('task-list-container');
  const remindersContainer = document.getElementById('reminders-container');
  const calendarGrid = document.getElementById('calendar-grid-container');

  // 1. Guardar nueva actividad
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newTask = {
      id: Date.now(),
      title: document.getElementById('task-title').value.trim(),
      date: document.getElementById('task-date').value,
      priority: document.getElementById('task-priority').value
    };
    
    tasks.push(newTask);
    saveAndRender();
    form.reset();
  });

  function saveAndRender() {
    localStorage.setItem('mis_actividades', JSON.stringify(tasks));
    renderTasks();
    renderReminders();
    renderCalendar();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  function filterTasks(priority) {
    currentFilter = priority;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderTasks();
  }

  // 2. Renderizado de lista con formato legible (DD/MM/YYYY)
  function renderTasks() {
    taskList.innerHTML = '';
    const filtered = currentFilter === 'todas' ? tasks : tasks.filter(t => t.priority === currentFilter);
    
    if (filtered.length === 0) {
      taskList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Todavía no hay actividades en esta categoría.</p>';
      return;
    }

    filtered.forEach(task => {
      const [year, month, day] = task.date.split('-');
      const formattedDate = `${day}/${month}/${year}`;
      
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div class="task-info">
          <h4>${task.title}</h4>
          <p>📅 Vence: <strong>${formattedDate}</strong></p>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span class="badge badge-${task.priority.toLowerCase()}">${task.priority}</span>
          <button class="btn-delete" onclick="deleteTask(${task.id})">Eliminar</button>
        </div>
      `;
      taskList.appendChild(li);
    });
  }

  // 3. Recordatorios Inteligentes (Próximos 7 días)
  function renderReminders() {
    remindersContainer.innerHTML = '';
    const today = new Date();
    today.setHours(0,0,0,0);

    const upcoming = tasks.filter(t => {
      const [y, m, d] = t.date.split('-');
      const taskDate = new Date(y, m - 1, d);
      const diffDays = Math.ceil((taskDate - today) / (1000 * 60 * 60 * 24));
      return diffDays >= 0 && diffDays <= 7;
    }).sort((a, b) => new Date(a.date) - new Date(b.date));

    if (upcoming.length === 0) {
      remindersContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">¡Todo al día! Sin tareas para los próximos 7 días.</p>';
      return;
    }

    upcoming.forEach(t => {
      const [y, m, d] = t.date.split('-');
      const div = document.createElement('div');
      div.className = 'task-item';
      div.style.background = '#FFFFFF';
      div.innerHTML = `
        <div>
          <strong>${t.title}</strong> 
          <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Vencimiento: ${d}/${m}/${y}</span>
        </div>
        <span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span>
      `;
      remindersContainer.appendChild(div);
    });
  }

  // 4. Calendario Dinámico Real
  function renderCalendar() {
    calendarGrid.innerHTML = '';
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    
    // Ajustar para que la semana empiece en Lunes (0 = Lun, 6 = Dom)
    const paddingDays = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    // Espacios vacíos del mes anterior
    for (let i = 0; i < paddingDays; i++) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'cal-day';
      emptyDiv.style.opacity = '0.3';
      emptyDiv.style.border = 'none';
      calendarGrid.appendChild(emptyDiv);
    }

    // Días del mes
    for (let day = 1; day <= totalDays; day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'cal-day';
      dayDiv.innerHTML = `<span>${day}</span>`;

      // Armar string de fecha actual del bucle (YYYY-MM-DD)
      const formattedMonth = String(month + 1).padStart(2, '0');
      const formattedDay = String(day).padStart(2, '0');
      const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

      // Buscar si hay tareas este día
      const dayTasks = tasks.filter(t => t.date === dateStr);
      if (dayTasks.length > 0) {
        const dotsContainer = document.createElement('div');
        dotsContainer.style.display = 'flex';
        dotsContainer.style.gap = '2px';
        dotsContainer.style.marginTop = '4px';

        dayTasks.forEach(t => {
          const dot = document.createElement('span');
          dot.className = 'dot';
          if (t.priority === 'Normal') dot.style.background = '#7C3AED';
          if (t.priority === 'Importante') dot.style.background = '#D97706';
          if (t.priority === 'Urgente') dot.style.background = '#DC2626';
          dotsContainer.appendChild(dot);
        });
        dayDiv.appendChild(dotsContainer);
      }

      calendarGrid.appendChild(dayDiv);
    }
  }

  // Inicialización
  saveAndRender();
</script>
